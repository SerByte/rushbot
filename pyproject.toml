[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rushbot"
version = "1.0.0"
description = "Statlockle Rush solver + humanized bot for statlocker.gg"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["cryptography>=42.0"]
keywords = ["deadlock", "statlocker", "statlockle", "bot", "solver"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
]

[project.scripts]
rushbot = "rushbot.__main__:main"

[tool.setuptools]
packages = ["rushbot"]
