[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rushbot"
version = "1.0.0"
description = "Statlockle Rush solver + humanized bot for statlocker.gg"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "SerByte" }]
requires-python = ">=3.10"
dependencies = ["cryptography>=42.0"]
keywords = ["deadlock", "statlocker", "statlockle", "bot", "solver", "anti-cheat", "humanization"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/SerByte/rushbot"
Repository = "https://github.com/SerByte/rushbot"

[project.scripts]
rushbot = "rushbot.__main__:main"

[tool.setuptools]
packages = ["rushbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
